const DATA={"bank":[["v","Parmi les propositions suivantes, laquelle constitue une participation citoyenne ?",["Participer bénévolement à une association","Ne jamais participer à la vie locale","Refuser toutes les consultations publiques","Interdire les débats"],0,"Le bénévolat associatif est une forme de participation citoyenne."],["v","Que garantit la liberté d’expression ?",["Le droit de diffamer","Le droit de menacer autrui","Le droit de communiquer ses idées dans les limites de la loi","L'absence de toute responsabilité"],2,"La liberté d'expression protège les opinions mais n'autorise pas les infractions comme la diffamation."],["v","À quoi sert un titre de séjour ?",["À devenir automatiquement français","À autoriser un étranger à séjourner en France selon les conditions du titre","À voter à l'élection présidentielle","À remplacer le passeport dans tous les pays"],1,"Un titre de séjour permet à son titulaire étranger de résider légalement en France selon sa catégorie."],["v","La liberté de circulation permet à toute personne de :",["Se déplacer librement dans le respect de la loi","Entrer dans tous les logements sans autorisation","Passer toute frontière sans document","Ignorer les règles de sécurité"],0,"La liberté d'aller et venir s'exerce sous réserve des restrictions légales."],["v","Concernant la pratique de la religion, quelle proposition est correcte ?",["Tout le monde doit avoir une religion","Une seule religion est reconnue par l'État","On ne peut jamais changer de religion","Chacun est libre de croire ou de ne pas croire"],3,"La liberté de conscience inclut le droit de pratiquer une religion ou aucune."],["v","En tant que parent, peut-on refuser que son enfant participe aux cours de sport à l'école car ils sont mixtes ?",["Oui, sans justification","Non, la mixité ne dispense pas des enseignements obligatoires","Oui, pour tous les cours publics","Oui, si l'enfant est mineur"],1,"Les activités scolaires obligatoires s'appliquent aux élèves et le seul motif de mixité ne justifie pas une dispense."],["v","Quelle est la devise de la France ?",["Travail, famille, patrie","Paix, travail, justice","Liberté, Égalité, Fraternité","Unité, sécurité, prospérité"],2,"La devise figure à l'article 2 de la Constitution."],["v","La répudiation de sa femme est :",["Un moyen ordinaire de divorce en France","Valable dès qu'elle est annoncée oralement","Obligatoire après séparation","Sans effet comme dissolution unilatérale du mariage civil en droit français"],3,"Le mariage civil ne prend pas fin par une répudiation unilatérale."],["v","Les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?",["Ils servent notamment à financer écoles, hôpitaux et infrastructures","Ils servent exclusivement aux salaires des députés","Ils sont facultatifs pour les résidents","Ils ne financent aucun service public"],0,"Les prélèvements obligatoires contribuent au financement des services publics et de la solidarité."],["v","Que fait l’État pour lutter contre les discriminations ?",["Il laisse chaque employeur agir librement","Il les interdit par la loi et prévoit des sanctions","Il interdit uniquement les discriminations entre citoyens français","Il autorise les discriminations dans les services publics"],1,"Les discriminations prohibées peuvent donner lieu à des sanctions et à des recours."],["v","Que représente Marianne ?",["La République française","La présidence du Sénat","Une région administrative","L'Union européenne"],0,"Marianne est une figure allégorique de la République française."],["v","Qu'est-ce que la liberté d'association ?",["Une obligation d'adhérer à un parti","Le droit de créer une association licite ou d'y adhérer","Un droit réservé aux élus","Le droit de ne jamais respecter les règles"],1,"La liberté d'association permet de se regrouper pour poursuivre un objet licite."],["v","Qu'est-ce que la Marseillaise ?",["Une fête nationale","Une devise européenne","L'hymne national français","Une loi constitutionnelle"],2,"La Marseillaise est l'hymne national de la France."],["v","Un employeur refuse d’embaucher des femmes dans son entreprise. Que dit la loi ?",["L'employeur peut toujours le faire","C'est légal après 50 ans","C'est autorisé pour les petites entreprises","Il s'agit d'une discrimination interdite"],3,"Le sexe est un motif prohibé de discrimination à l'embauche."],["v","Une des valeurs de la devise républicaine est l'égalité. Qu'est-ce que cela signifie ?",["Les personnes sont égales en droits devant la loi","Tous doivent avoir exactement le même salaire","Tout le monde doit faire les mêmes études","Toute différence de situation est illégale"],0,"L'égalité devant la loi garantit les mêmes droits sans discriminations illégales."],["v","Quelle est la place de la langue française dans la République ?",["Une langue régionale facultative","La langue de la République","Une langue réservée à l'école","La langue de l'Union européenne uniquement"],1,"L'article 2 de la Constitution indique que la langue de la République est le français."],["v","Que dit l'article 1er de la Constitution française ?",["La France est une monarchie","La France est un État confessionnel","La France est une République indivisible, laïque, démocratique et sociale","Le vote est obligatoire"],2,"L'article premier énonce ces quatre caractéristiques de la République."],["i","Qu'est-ce que l'État de droit ?",["Un État où personne n'a de droits","Un État où le gouvernement est au-dessus des lois","Un État régi uniquement par les traditions","Un État dans lequel tous, y compris les pouvoirs publics, sont soumis au droit"],3,"L'État de droit implique le respect de la hiérarchie des normes et le contrôle de l'action publique."],["i","La loi est l'expression de :",["La volonté générale","La seule volonté du président","La seule volonté du préfet","La seule volonté des juges"],0,"La Déclaration de 1789 énonce que la loi est l'expression de la volonté générale."],["i","Quelle est la durée du mandat du conseil municipal et du maire ?",["4 ans","6 ans","5 ans","7 ans"],1,"Le conseil municipal est élu pour six ans et désigne le maire."],["i","Une personne peut-elle voter à la place d'une autre ?",["Oui, sans formalité","Oui, si elles vivent ensemble","Oui, avec une procuration valide","Non, même avec une procuration"],2,"Un mandataire peut voter pour une autre personne lorsque celle-ci lui a donné une procuration régulière."],["i","Est-ce que le vote est obligatoire ?",["Oui, à toutes les élections","Oui, uniquement aux municipales","Oui, avec une amende automatique","Non, le vote n'est pas obligatoire en France"],3,"Le vote est un droit civique, mais il n'est pas obligatoire en France."],["i","À la fin de son mandat, le président de la République peut-il décider de rester au pouvoir ?",["Non, il ne peut pas prolonger seul son mandat","Oui, par simple déclaration","Oui, sans élection pendant dix ans","Oui, avec l'accord de son parti"],0,"Le mandat présidentiel est encadré par la Constitution et ne se prolonge pas par une décision personnelle."],["i","Qui dirige l'action du Gouvernement ?",["Le préfet","Le Premier ministre","Le président de l'Assemblée nationale","Le Conseil constitutionnel"],1,"L'article 21 de la Constitution indique que le Premier ministre dirige l'action du Gouvernement."],["i","Qui nomme le Premier ministre ?",["Le Sénat","Le Conseil d'État","Le président de la République","Les maires"],2,"L'article 8 de la Constitution donne cette compétence au président de la République."],["i","Pourquoi séparer les trois pouvoirs dans une démocratie ?",["Pour permettre aux juges de faire seuls toutes les lois","Pour supprimer les élections","Pour interdire le contrôle du Parlement","Pour éviter la concentration des pouvoirs et favoriser leur contrôle mutuel"],3,"La séparation des pouvoirs limite les abus et garantit un fonctionnement démocratique."],["i","Quel État a quitté l'Union européenne en 2020 ?",["Le Royaume-Uni","L'Espagne","L'Italie","La Belgique"] 'aide à la procréation."],["d","Concernant le droit de se marier, quelle proposition est correcte ?",["Le mariage est réservé aux couples de nationalité française","Seul un mariage religieux est reconnu par l'État","Deux adultes peuvent se marier s'ils respectent les conditions légales, quel que soit leur sexe","Un mariage peut être imposé par les parents"],2,"En France, le mariage civil est ouvert aux couples de même sexe ou de sexe différent sous les conditions légales."],["d","Est-il toujours possible de divorcer ?",["Non, jamais sans consentement réciproque","Non, après dix ans de mariage","Non, si les enfants sont mineurs","Oui, il existe plusieurs procédures, y compris sans accord des deux époux"],3,"Le divorce peut être demandé selon plusieurs voies prévues par le Code civil."],["d","La peine de mort est :",["Abolie en France","Possible pour certains crimes","Prévue automatiquement pour un meurtre","Décidée par le préfet"],0,"La peine de mort a été abolie en France en 1981."],["d","Le recours à l'avortement est-il autorisé ?",["Non, en toute circonstance","Oui, dans le cadre de la loi","Uniquement pour les personnes mariées","Uniquement avec l'accord du conjoint"],1,"L'interruption volontaire de grossesse est légale dans les conditions fixées par la loi."],["d","Que contient la Constitution ?",["Seulement le budget annuel","Uniquement les programmes scolaires","Les principes fondamentaux et les règles d'organisation des pouvoirs publics","La liste complète des communes"],2,"La Constitution est la norme fondamentale organisant les institutions et protégeant des droits."],["d","Que garantit la liberté de la presse ?",["Le droit de publier des menaces","La gratuité de tous les journaux","L'interdiction de critiquer le gouvernement","La liberté d'informer dans les limites fixées par la loi"],3,"La liberté de la presse s'exerce avec des responsabilités, notamment contre la diffamation."],["d","Que signifie la dignité humaine ?",["Toute personne mérite le respect en raison de son humanité","La dignité dépend du salaire","Seuls les citoyens ont une dignité","La dignité peut être retirée par un employeur"],0,"La dignité humaine est inhérente à chaque personne."],["d","Que signifie le droit de manifester ?",["Le droit d'imposer une opinion par la violence","Le droit d'exprimer collectivement des opinions dans le respect de la loi","Le droit d'entrer de force dans les bâtiments","Le droit d'empêcher toute circulation sans restriction"],1,"La liberté de manifestation permet l'expression collective encadrée par le droit."],["d","Qu'est-ce que le droit de grève ?",["Le droit de ne jamais travailler","Une obligation syndicale","Le droit de cesser collectivement le travail pour des revendications professionnelles","Le droit d'être payé intégralement pendant toute grève"],2,"La grève est une cessation collective et concertée du travail en appui à des revendications professionnelles."],["d","Jeter un mégot par terre est :",["Autorisé en ville","Sans conséquence juridique","Obligatoire près des poubelles","Interdit et passible de sanction"],3,"Jeter un mégot dans l'espace public constitue un abandon de déchet sanctionnable."],["d","Pourquoi doit-on trier ses déchets ?",["Pour favoriser le recyclage et réduire les impacts environnementaux","Pour mélanger les matières recyclables","Pour éviter de payer les impôts","Pour remplacer le ramassage des déchets"],0,"Le tri facilite le recyclage et la valorisation des déchets."],["d","Quelle est l'infraction la plus grave ?",["La contravention","Le crime","Le délit","L'irrégularité administrative"],1,"En droit pénal français, les trois catégories principales sont contravention, délit et crime, par ordre croissant de gravité."],["h","Quel était le surnom de Louis XIV ?",["Le Roi citoyen","Le Roi chevalier","Le Roi-Soleil","Le Roi prudent"],2,"Louis XIV est surnommé le Roi-Soleil."],["h","Quel roi de France a été exécuté pendant la Révolution française ?",["Louis XIII","Louis XIV","Louis XVIII","Louis XVI"],3,"Louis XVI est guillotiné le 21 janvier 1793."],["h","En quelle année Napoléon Ier est-il devenu empereur ?",["1804","1789","1815","1848"],0,"Napoléon Ier devient empereur en 1804."],["h","De quand date l'appel à la résistance du général de Gaulle ?",["11 novembre 1918","18 juin 1940","8 mai 1945","14 juillet 1789"],1,"L'appel du 18 juin 1940 est lancé depuis Londres."],["h","Depuis quand les Français élisent-ils le président de la République au suffrage universel direct ?",["Depuis 1789","Depuis 1958","Depuis 1965","Depuis 2002"],2,"La réforme date de 1962, et la première élection présidentielle au suffrage universel direct sous la Ve République a eu lieu en 1965."],["h","Quelle est la première étape de la construction européenne en 1951 ?",["La création de l'euro","L'espace Schengen","L'Union européenne à 27 États","La Communauté européenne du charbon et de l'acier (CECA)"],3,"La CECA est instituée par le traité de Paris de 1951."],["h","En 1944, qu'est-ce qui a changé pour les femmes ?",["Elles obtiennent le droit de vote et d'éligibilité","Elles obtiennent le droit de travailler pour la première fois","Elles deviennent toutes électrices européennes","Elles doivent voter obligatoirement"],0,"L'ordonnance du 21 avril 1944 reconnaît aux femmes françaises le droit de vote et d'éligibilité."],["h","Quelle organisation internationale a été créée en 1945 après la Seconde Guerre mondiale ?",["L'Union européenne","L'Organisation des Nations unies (ONU)","Le Conseil de l'Europe","La Banque centrale européenne"],1,"L'ONU est fondée en 1945 pour favoriser la paix et la coopération internationale."],["h","En quelle année l'euro est-elle devenue la monnaie utilisée en France ?",["1992","1999","2002","2010"],2,"L'euro circule sous forme de pièces et billets depuis le 1er janvier 2002."],["h","Où a eu lieu le débarquement en 1944 ?",["En Bretagne","En Corse","Sur la Côte d'Azur uniquement","En Normandie"],3,"Le débarquement allié du 6 juin 1944 a lieu en Normandie."],["h","Que fête-t-on le 8 mai ?",["La victoire de 1945 sur l'Allemagne nazie","La prise de la Bastille","L'armistice de 1918","La naissance de l'euro"],0,"Le 8 mai commémore la victoire des Alliés sur l'Allemagne nazie en 1945."],["h","Quelle chaîne de montagnes est située entre la France et l’Espagne ?",["Les Alpes","Les Pyrénées","Le Jura","Les Vosges"],1,"Les Pyrénées séparent la France de l'Espagne."],["h","Quel fleuve traverse Paris ?",["La Loire","Le Rhône","La Seine","La Garonne"],2,"Paris est traversé par la Seine."],["h","Quelle île française se trouve dans l'océan Indien ?",["La Corse","La Martinique","La Guadeloupe","La Réunion"],3,"La Réunion est un département et une région d'outre-mer situés dans l'océan Indien."],["s","Quel mariage est reconnu par l'État ?",["Le mariage civil","Uniquement le mariage religieux","Le mariage célébré sans témoin ni officiant","Le mariage décidé par les parents"],0,"Le mariage civil, célébré par un officier de l'état civil, produit les effets juridiques reconnus par l'État."],["s","Auprès de quelle institution les parents peuvent-ils inscrire leur enfant à l'école publique ?",["La préfecture","La mairie pour l'école primaire publique","Le tribunal correctionnel","Le ministère des Finances"],1,"Pour l'inscription en école publique maternelle ou élémentaire, les parents s'adressent en principe à la mairie."],["s","En cas de divorce, qui exerce l'autorité parentale ?",["Toujours le père uniquement","Toujours la mère uniquement","En principe les deux parents, sauf décision judiciaire contraire","Le maire de la commune"],2,"La séparation ne supprime pas en principe l'exercice conjoint de l'autorité parentale."],["s","Quelle aide permet aux personnes qui ont des difficultés financières d'avoir un avocat ?",["Le RSA exclusivement","Une bourse scolaire","Une aide au logement","L'aide juridictionnelle"],3,"L'aide juridictionnelle peut prendre en charge tout ou partie des frais de justice selon les ressources et conditions légales."],["s","Où faut-il déclarer la naissance d'un enfant ?",["À la mairie du lieu de naissance","À la préfecture uniquement","Au commissariat","À l'ambassade de l'Union européenne"],0,"La déclaration de naissance s'effectue auprès de l'officier de l'état civil du lieu de naissance, généralement dans les cinq jours."],["s","Où peut-on déposer un lave-vaisselle cassé ?",["Dans une rivière","En déchèterie ou dans une filière de reprise agréée","Sur le trottoir sans règle","Dans une poubelle à verre"],1,"Les gros appareils doivent rejoindre des circuits adaptés de collecte ou de reprise."],["s","Quel numéro d'urgence permet d'appeler la police ?",["15","18","17","115"],2,"Le 17 permet de joindre Police secours ; le 112 est le numéro d'urgence européen."],["s","Qu’est-ce que le principe de confidentialité dans le domaine de la santé ?",["Les informations médicales sont toujours publiques","Les employeurs reçoivent tous les dossiers","Les médecins peuvent tout publier","Les données de santé sont protégées par le secret professionnel"],3,"Le secret médical protège les informations de santé du patient, sous réserve des exceptions légales."],["s","Qui peut demander un congé parental d'éducation ?",["Un salarié père ou mère remplissant les conditions légales","Seulement la mère","Seulement le père","Seulement les fonctionnaires"],0,"Le congé parental d'éducation peut bénéficier à chacun des deux parents salariés dans les conditions légales."],["s","Quelles sont les affaires traitées par le conseil de prud'hommes ?",["Les divorces","Les litiges individuels liés au contrat de travail privé","Les crimes","Les élections municipales"],1,"Les prud'hommes traitent notamment des désaccords individuels entre employeurs privés et salariés."],["s","Travailler sans être déclaré est :",["Obligatoire pour un étudiant","Autorisé en dessous de 18 ans","Illégal et peut relever du travail dissimulé","Une pratique recommandée"],2,"Le travail dissimulé est interdit et expose à des sanctions."],["s","Quelle est la mission de France Travail ?",["Fixer le montant des impôts","Organiser les mariages civils","Rédiger la Constitution","Accompagner les demandeurs d'emploi et favoriser le retour à l'emploi"],3,"France Travail aide à la recherche d'emploi et accompagne les personnes et employeurs."],["s","À quel âge commence l'instruction obligatoire des enfants ?",["3 ans","6 ans","5 ans","7 ans"],0,"En France, l'instruction est obligatoire de 3 à 16 ans."],["s","Quel est l'âge de la majorité ?",["16 ans","18 ans","21 ans","20 ans"],1,"La majorité civile est fixée à 18 ans."],["s","Comment s'appelle le diplôme passé par les élèves à la fin du collège ?",["Le baccalauréat","Le CAP","Le diplôme national du brevet","Le BTS"],2,"Le diplôme national du brevet évalue les acquis en fin de collège."],["s","Qu'est-ce que l'école maternelle ?",["Une école pour les étudiants","Une école uniquement payante","Une école réservée aux enfants de plus de six ans","La première étape de l'école, accueillant en général les enfants de 3 à 6 ans"],3,"L'école maternelle est intégrée à l'école primaire et accueille en principe les enfants de 3 à 6 ans."]],"themes":{"v":"Principes et valeurs","i":"Institutions","d":"Droits et devoirs","h":"Histoire et géographie","s":"Vie en société"},"lessons":{"v":["République et laïcité","La Constitution définit la France comme une République indivisible, laïque, démocratique et sociale. La devise est « Liberté, Égalité, Fraternité ». La laïcité garantit la liberté de conscience et la neutralité de l'État. On peut croire, ne pas croire ou changer de conviction. L'égalité interdit les discriminations illégales, notamment au travail et dans les services publics."],"i":["Institutions et Union européenne","Le président de la République nomme le Premier ministre ; celui-ci dirige l'action du Gouvernement. Le Parlement vote les lois. L'Assemblée nationale et le Sénat constituent les deux chambres. Le maire et son conseil municipal ont un mandat de six ans. L'Union européenne a pour devise « Unie dans la diversité ». Le siège officiel du Parlement européen est Strasbourg."],"d":["Droits et responsabilités","Le droit français protège la liberté d'expression, la liberté de la presse, la liberté de manifester et la liberté d'association, dans les limites de la loi. La peine de mort est abolie. Le travail dissimulé, les violences et les discriminations sont interdits. Les infractions sont classées en contraventions, délits et crimes."],"h":["Grandes dates et géographie","1789 : Révolution française et Déclaration des droits de l'homme et du citoyen. 1804 : Napoléon devient empereur. 18 juin 1940 : appel de De Gaulle. 1944 : droit de vote et d'éligibilité des femmes. 1945 : fin de la guerre en Europe et fondation de l'ONU. 1981 : abolition de la peine de mort. 2002 : mise en circulation des billets et pièces en euros."],"s":["La vie quotidienne en France","L'instruction est obligatoire dès trois ans. L'inscription en école primaire publique passe généralement par la mairie. Une naissance est déclarée à la mairie du lieu de naissance. Le 17 est le numéro de police secours ; le 15 celui du SAMU ; le 18 celui des pompiers ; le 112 fonctionne dans l'Union européenne. Le conseil de prud'hommes traite les litiges individuels liés au contrat de travail privé."]}};
const bank=DATA.bank,themes=DATA.themes,lessons=DATA.lessons;
const KEY="civique-cr-v1";const $=id=>document.getElementById(id);
let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){saved={}}
if(!Array.isArray(saved.seen))saved.seen=[];if(!Array.isArray(saved.history))saved.history=[];
let session=null,seconds=0,clock=null,activeTheme="v";
function store(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function show(id){["homePanel","lessonPanel","quizPanel","resultPanel"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function stats(){const last=saved.history.at(-1);$("last").textContent=last?"Dernier test : "+last.score+"/"+last.total+" bonnes réponses.":"";}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function select(n){const left=shuffle(bank.map((_,i)=>i).filter(i=>!saved.seen.includes(i)));if(left.length>=n)return left.slice(0,n);const right=shuffle(bank.map((_,i)=>i).filter(i=>saved.seen.includes(i)));return left.concat(right).slice(0,n)}
function test(n){clearInterval(clock);const ids=select(n);session={ids,answers:{},pos:0,total:n,start:Date.now()};seconds=n===40?45*60:0;show("quizPanel");paint();if(n===40){clock=setInterval(()=>{seconds--;paintTimer();if(seconds<=0)finish()},1000)}window.scrollTo({top:0,behavior:"smooth"})}
function paintTimer(){$("timer").textContent=session.total===40?String(Math.floor(Math.max(0,seconds)/60)).padStart(2,"0")+":"+String(Math.max(0,seconds)%60).padStart(2,"0"):"";}
function paint(){const p=session.pos,q=bank[session.ids[p]],a=session.answers[p];$("counter").textContent="QUESTION "+(p+1)+" / "+session.total;$("category").textContent=themes[q[0]];$("question").textContent=q[1];$("bar").style.width=(100*(p+1)/session.total)+"%";paintTimer();const root=$("choices");root.replaceChildren();q[2].forEach((opt,j)=>{const btn=document.createElement("button");btn.className="choice"+(a===j?" active":"");btn.setAttribute("aria-pressed",a===j?"true":"false");const letter=document.createElement("span");letter.className="letter";letter.textContent="ABCD"[j];const label=document.createElement("span");label.textContent=opt;btn.append(letter,label);btn.onclick=()=>{session.answers[p]=j;paint()};root.append(btn)});$("back").disabled=p===0;$("next").textContent=p===session.total-1?"Terminer et corriger →":"Suivant →";$("dots").replaceChildren();session.ids.forEach((id,i)=>{const b=document.createElement("button");b.className="dot"+(i===p?" current":session.answers[i]!==undefined?" filled":"");b.title="Question "+(i+1);b.textContent=i+1;b.onclick=()=>{session.pos=i;paint()};$("dots").append(b)})}
function finish(){if(!session)return;clearInterval(clock);const s=session;session=null;const correct=s.ids.reduce((a,id,i)=>a+(s.answers[i]===bank[id][3]?1:0),0);const pct=Math.round(correct/s.total*100);saved.seen=Array.from(new Set(saved.seen.concat(s.ids)));saved.history.push({score:correct,total:s.total,at:new Date().toISOString()});saved.history=saved.history.slice(-60);store();$("score").textContent=correct+" / "+s.total;$("verdict").textContent=pct+" % de bonnes réponses";$("resultNote").textContent="Seuil de référence : 80 %. Test de connaissances uniquement.";$("corrections").replaceChildren();s.ids.forEach((id,i)=>{const q=bank[id],right=s.answers[i]===q[3],box=document.createElement("article");box.className="correction";const heading=document.createElement("h4");heading.textContent=(i+1)+". "+q[1];const answer=document.createElement("div");answer.className=right?"good":"bad";answer.textContent=(right?"✓ Correct : ":"✕ Réponse correcte : ")+("ABCD"[q[3]])+". "+q[2][q[3]];box.append(heading,answer);if(!right){const yours=document.createElement("p");yours.textContent="Ta réponse : "+(s.answers[i]===undefined?"Aucune":("ABCD"[s.answers[i]])+". "+q[2][s.answers[i]]);box.append(yours)}const exp=document.createElement("p");exp.textContent=q[4];box.append(exp);$("corrections").append(box)});stats();show("resultPanel");window.scrollTo({top:0,behavior:"smooth"})}
function lesson(t){activeTheme=t;$("lessonNav").replaceChildren();Object.keys(themes).forEach(k=>{const b=document.createElement("button");b.className="topic"+(k===t?" active":"");b.textContent=themes[k];b.onclick=()=>lesson(k);$("lessonNav").append(b)});$("lessonText").replaceChildren();const h=document.createElement("h3"),p=document.createElement("p");h.textContent=lessons[t][0];p.className="lesson";p.textContent=lessons[t][1];$("lessonText").append(h,p)}
$("tabTest").onclick=()=>{$("tabTest").classList.add("sel");$("tabLessons").classList.remove("sel");clearInterval(clock);session=null;show("homePanel")};
$("tabLessons").onclick=()=>{$("tabLessons").classList.add("sel");$("tabTest").classList.remove("sel");clearInterval(clock);session=null;lesson(activeTheme);show("lessonPanel")};
$("start15").onclick=()=>test(15);$("start40").onclick=()=>test(40);
$("back").onclick=()=>{if(session.pos>0){session.pos--;paint()}};
$("next").onclick=()=>{if(session.pos<session.total-1){session.pos++;paint()}else{const unanswered=session.total-Object.keys(session.answers).length;if(unanswered&&!confirm("Il reste "+unanswered+" question(s) sans réponse. Terminer quand même ?"))return;finish()}};
$("restart").onclick=()=>{$("tabTest").classList.add("sel");$("tabLessons").classList.remove("sel");show("homePanel")};
document.addEventListener("keydown",e=>{if(!session)return;if(e.key==="ArrowLeft"&&session.pos>0){session.pos--;paint()}if(e.key==="ArrowRight"&&session.pos<session.total-1){session.pos++;paint()}if(["1","2","3","4"].includes(e.key)&&!e.altKey&&!e.ctrlKey){session.answers[session.pos]=Number(e.key)-1;paint()}});
stats();lesson("v");
</script></body></html>
